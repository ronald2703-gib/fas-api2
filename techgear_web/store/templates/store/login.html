{% extends 'store/base.html' %}

{% block title %}Iniciar sesión - TechGear{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="tg-card p-4 p-md-5">
            <div class="text-center mb-4">
                <span class="tg-auth-icon mb-3"><i class="bi bi-shield-lock"></i></span>
                <h3 class="fw-bold mb-1">Bienvenido</h3>
                <p class="text-muted mb-0">Inicia sesión para continuar</p>
            </div>

            {% if error %}
                <div class="alert alert-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}</div>
            {% endif %}

            <form method="POST" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="email">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" name="email" class="form-control" value="{{ email|default:'' }}" placeholder="tu@correo.com" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-tg w-100 py-2"><i class="bi bi-box-arrow-in-right me-1"></i>Entrar</button>
            </form>
            <p class="text-center text-muted mt-4 mb-0">¿No tienes cuenta? <a href="{% url 'register' %}" class="fw-semibold">Regístrate</a></p>
        </div>
    </div>
</div>
{% endblock %}
