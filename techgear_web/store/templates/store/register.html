{% extends 'store/base.html' %}

{% block title %}Registro - TechGear{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="tg-card p-4 p-md-5">
            <div class="text-center mb-4">
                <span class="tg-auth-icon mb-3"><i class="bi bi-person-plus"></i></span>
                <h3 class="fw-bold mb-1">Crear cuenta</h3>
                <p class="text-muted mb-0">Únete a TechGear en segundos</p>
            </div>

            {% if error %}
                <div class="alert alert-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="nombre">Nombre</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" id="nombre" name="nombre" class="form-control" value="{{ form.nombre|default:'' }}" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" name="email" class="form-control" value="{{ form.email|default:'' }}" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" id="password" name="password" class="form-control" required minlength="6">
                    </div>
                    <div class="form-text">Mínimo 6 caracteres.</div>
                </div>
                <button type="submit" class="btn btn-tg w-100 py-2"><i class="bi bi-check2-circle me-1"></i>Registrarme</button>
            </form>
            <p class="text-center text-muted mt-4 mb-0">¿Ya tienes cuenta? <a href="{% url 'login' %}" class="fw-semibold">Inicia sesión</a></p>
        </div>
    </div>
</div>
{% endblock %}
